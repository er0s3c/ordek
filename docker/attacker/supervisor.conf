[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid

# Tarayıcı terminali — proxy bunu köke (/) servis eder.
[program:ttyd]
command=ttyd -p 7681 -i 0.0.0.0 -W -t fontSize=15 -t 'theme={"background":"#0d0f0b"}' bash -l
autorestart=true
priority=10
stdout_logfile=/var/log/ttyd.log
stderr_logfile=/var/log/ttyd.err

# ---- GUI yığını (Wireshark/Burp/BeEF için noVNC masaüstü) — proxy /desktop/ ----
[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1440x900x24 -ac
autorestart=true
priority=20
environment=DISPLAY=":1"

[program:fluxbox]
command=/usr/bin/fluxbox
autorestart=true
priority=30
environment=DISPLAY=":1"

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -nopw -rfbport 5900 -quiet
autorestart=true
priority=40

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
priority=50
stdout_logfile=/var/log/novnc.log
stderr_logfile=/var/log/novnc.err
